<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account on My Blog.">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Register</h1>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="components.html">Components</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="register.html" aria-current="page">Register</a></li>
        <li><a href="data.html">Data</a></li>
      </ul>
    </nav>
  </header>


  <main>
    <section class="panel">
      <h2>Create an Account</h2>
      <p>All fields are required.</p>
      <form id="regForm" novalidate>
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" aria-describedby="nameError">
          <p class="error-message" id="nameError" aria-live="polite"></p>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailError">
          <p class="error-message" id="emailError" aria-live="polite"></p>
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" aria-describedby="passwordError">
          <p class="error-message" id="passwordError" aria-live="polite"></p>
        </div>

        <div class="form-row">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" aria-describedby="confirmError">
          <p class="error-message" id="confirmError" aria-live="polite"></p>
        </div>

        <div class="form-row">
          <label for="age">Age</label>
          <input type="text" id="age" name="age" inputmode="numeric" aria-describedby="ageError">
          <p class="error-message" id="ageError" aria-live="polite"></p>
        </div>

        <div class="form-actions">
          <button type="submit">Sign up</button>
          <button type="reset" class="secondary-button" id="resetBtn">Clear Form</button>
        </div>
        <div class="alert alert-success" role="status" id="success" hidden>
          <strong>Success!</strong> Your account form is valid and was submitted.
        </div>
      </form>
    </section>
  </main>


  <footer>
    <p>&copy; 2026 My Blog</p>
  </footer>
  
  <script>
    const form = document.getElementById("regForm");
    const successBox = document.getElementById("success");

    // Show (or clear) an error under one field. Returns true when the field is valid.
    function setError(id, message) {
      document.getElementById(id + "Error").textContent = message;
      document.getElementById(id).classList.toggle("invalid", message !== "");
      return message === "";
    }

    function validate() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const ageText = document.getElementById("age").value.trim();
      const age = Number(ageText);

      const results = [
        setError("name",
          name === "" ? "Name is required." :
          name.length < 2 ? "Name must be at least 2 characters." : ""),

        setError("email",
          email === "" ? "Email is required." :
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "Please enter a valid email address." : ""),

        setError("password",
          password === "" ? "Password is required." :
          password.length < 8 ? "Password must be at least 8 characters." : ""),

        setError("confirm",
          confirm === "" ? "Please confirm your password." :
          confirm !== password ? "Passwords do not match." : ""),

        setError("age",
          ageText === "" ? "Age is required." :
          !/^\d+$/.test(ageText) ? "Age must be a whole number." :
          (age < 1 || age > 120) ? "Age must be between 1 and 120." : "")
      ];

      return results.every(Boolean);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();              // block sending first
      successBox.hidden = true;
      if (validate()) {
        successBox.hidden = false;
        form.reset();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", function () {
      ["name", "email", "password", "confirm", "age"].forEach(id => setError(id, ""));
      successBox.hidden = true;
    });
  </script>
</body>
</html>
